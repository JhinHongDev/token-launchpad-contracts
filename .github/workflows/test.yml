name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      # 版本钉定：forge fmt 规则跨版本不兼容（如结构体字面量缩进、文件末尾 interface 缩进），
      # 必须与本地开发版本一致，否则 fmt --check 结果不可复现
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Slither
        run: pipx install slither-analyzer

      # 策略见 slither.config.json：
      #   - lib/（第三方）路径过滤
      #   - Info/Low 级噪音检测器整体排除（命名/汇编/低级调用等结构性或风格性发现，不参与门禁）
      #   - High/Medium 检测器全部保留，fail_on: medium 拦截
      #   - 已核实误报用行内 slither-disable-next-line 压制（须附理由）
      - name: Run Slither
        run: slither . --sarif results.sarif

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-sarif
          path: results.sarif

  # 深度 invariant campaign（资金流不变量）：手动触发，供发版前/重点变更时深入探索
  invariants-deep:
    name: Deep invariant fuzz
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run invariant campaign
        run: forge test --match-contract LaunchpadInvariants --invariant-runs 1000 --invariant-depth 2000 -vvv
